<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Pro 20 Tập — An Vượng & Hằng Thu Pharma</title>
<style>
  :root {
    --bg: #080a0f;
    --panel: #121621;
    --border: #262e42;
    --text: #f8fafc;
    --muted: #94a3b8;
    --gold: #f6cf65;
    --emerald: #22c55e;
    --crimson: #f43f5e;
    --cyan: #38bdf8;
    --font-size: 56px;
    --line-height: 1.48;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Be Vietnam Pro", Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Top Control Bar */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 30;
  }
  .toolbar .group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-right: 10px;
    border-right: 1px solid var(--border);
  }
  .toolbar .group:last-child { border-right: none; }
  button, select {
    background: #1d2436;
    color: var(--text);
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  button:hover, select:hover { background: #29334d; }
  button.active { background: #0ea5e9; border-color: #38bdf8; color: #04101d; }
  button.play-btn { background: #16a34a; border-color: #22c55e; color: #fff; min-width: 96px; }
  button.play-btn.playing { background: #e11d48; border-color: #fb7185; }
  button.done-btn.is-done { background: #15803d; border-color: #4ade80; color: #fff; }
  label.slider-lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 84px; accent-color: var(--gold); }

  /* Main Workspace */
  .workspace {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  /* Sidebar Episode List */
  .sidebar {
    width: 310px;
    background: #0d111a;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.2s;
  }
  .sidebar.hidden { width: 0; border-right: none; }
  .filter-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 8px;
    border-bottom: 1px solid var(--border);
  }
  .filter-tabs button { padding: 6px 4px; font-size: 11px; }
  .ep-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .set-header {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: var(--gold);
    padding: 10px 6px 5px;
    text-transform: uppercase;
  }
  .ep-item {
    padding: 9px 10px;
    margin-bottom: 5px;
    border-radius: 9px;
    background: #141a27;
    border: 1px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .ep-item:hover { border-color: #3b4a6b; }
  .ep-item.active { background: #1e293b; border-color: var(--gold); }
  .ep-item.done { opacity: 0.62; }
  .badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .badge.av { background: #064e3b; color: #6ee7b7; border: 1px solid #10b981; }
  .badge.ht { background: #701a3c; color: #fda4af; border: 1px solid #f43f5e; }
  .ep-title { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .ep-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Prompter Stage */
  .stage-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  /* Eye-level Reading Guide Bar */
  .reading-guide {
    position: absolute;
    top: 28%;
    left: 0;
    right: 0;
    height: 110px;
    border-top: 2px solid rgba(246, 207, 101, 0.55);
    border-bottom: 2px solid rgba(246, 207, 101, 0.55);
    background: rgba(246, 207, 101, 0.05);
    pointer-events: none;
    z-index: 10;
  }
  .reading-guide::before {
    content: "▶";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 24px;
  }
  .reading-guide::after {
    content: "◀";
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 24px;
  }

  .prompter-scroll {
    height: 100%;
    overflow-y: auto;
    padding: 28vh 8% 60vh 8%;
    scroll-behavior: auto;
  }
  .prompter-scroll.mirror-x { transform: scaleX(-1); }
  .prompter-scroll.mirror-y { transform: scaleY(-1); }
  .prompter-scroll.mirror-xy { transform: scale(-1, -1); }

  .meta-banner {
    background: #111827;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 16px 22px;
    margin-bottom: 28px;
    font-size: 18px;
    line-height: 1.5;
  }
  .meta-banner .m-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .meta-banner .m-id { font-size: 24px; font-weight: 800; color: var(--gold); }
  .meta-banner .m-props { color: #7dd3fc; font-weight: 600; }
  .meta-banner .m-mood { color: #fde68a; }

  .hook-switcher {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .hook-switcher button { font-size: 14px; padding: 8px 14px; }

  .script-content {
    font-size: var(--font-size);
    line-height: var(--line-height);
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .line-hook {
    color: var(--gold);
    margin-bottom: 0.7em;
    border-left: 6px solid var(--gold);
    padding-left: 22px;
  }
  .line-body {
    color: #ffffff;
    margin-bottom: 0.65em;
  }
  .line-cta {
    color: #6ee7b7;
    margin-top: 0.7em;
    margin-bottom: 0.7em;
    border-left: 6px solid #22c55e;
    padding-left: 22px;
  }
  .line-cue {
    font-size: calc(var(--font-size) * 0.46);
    line-height: 1.35;
    color: #38bdf8;
    font-weight: 600;
    background: rgba(56, 189, 248, 0.11);
    border-radius: 10px;
    padding: 8px 16px;
    margin: 0.45em 0 0.55em 0;
  }
  .hide-cues .line-cue { display: none; }
  .slash-mark {
    color: #64748b;
    font-weight: 400;
    padding: 0 4px;
  }
  .disclaimer-box {
    margin-top: 32px;
    font-size: 18px;
    color: #94a3b8;
    border-top: 1px dashed #334155;
    padding-top: 14px;
    font-weight: 500;
  }
  .status-bar {
    position: absolute;
    bottom: 12px;
    right: 18px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid #334155;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    z-index: 25;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group">
    <button id="btnSidebar" title="Ẩn/Hiện danh sách tập">☰ Danh sách</button>
    <button id="btnPrev" title="Tập trước (←)">◀ Trước</button>
    <button id="btnNext" title="Tập sau (→)">Sau ▶</button>
  </div>
  <div class="group">
    <button id="btnPlay" class="play-btn">▶ CHẠY (Space)</button>
    <button id="btnReset">↺ Về đầu</button>
  </div>
  <div class="group">
    <label class="slider-lbl">Tốc độ <input id="rngSpeed" type="range" min="10" max="160" value="48"><span id="valSpeed">48</span></label>
    <label class="slider-lbl">Cỡ chữ <input id="rngFont" type="range" min="32" max="92" value="56"><span id="valFont">56</span></label>
  </div>
  <div class="group">
    <button id="btnMirrorX" title="Lật gương ngang cho kính Teleprompter">⇄ Lật Gương</button>
    <button id="btnCues" class="active" title="Bật/Tắt gợi ý tay & đạo cụ">🎬 Gợi ý diễn</button>
    <button id="btnDone" class="done-btn">☐ Đánh dấu đã quay</button>
  </div>
  <div class="group">
    <span id="progressTxt" style="font-size:13px;color:var(--gold);font-weight:700;">Đã quay: 0/20</span>
  </div>
</div>

<div class="workspace">
  <aside class="sidebar" id="sidebar">
    <div class="filter-tabs">
      <button class="f-btn active" data-filter="ALL">3 Set (20)</button>
      <button class="f-btn" data-filter="AV">An Vượng</button>
      <button class="f-btn" data-filter="HT">Hằng Thu</button>
      <button class="f-btn" data-filter="TODO">Chưa quay</button>
    </div>
    <div class="ep-list" id="epList"></div>
  </aside>

  <main class="stage-wrap">
    <div class="reading-guide"></div>
    <div class="prompter-scroll" id="scroller">
      <div id="stageContent"></div>
    </div>
    <div class="status-bar">
      Phím tắt: <b>Space</b> Chạy/Dừng · <b>↑/↓</b> Tăng/Giảm tốc · <b>←/→</b> Đổi tập · <b>R</b> Về đầu · <b>M</b> Lật gương
    </div>
  </main>
</div>

khử mùi, / giữ ẩm và thơm mát dễ chịu!"}, {"type": "cue", "text": "[😊 Mỉm cười thân thiện]"}, {"type": "cta", "text": "Gửi ngay cho cô bạn đồng nghiệp / ngồi dán mắt máy tính cả ngày nhé! / Nhắn GEL PHỤ KHANG để Hằng tư vấn!"}], "disclaimer": "Làm sạch dịu nhẹ, hỗ trợ khử mùi và giữ ẩm vùng nhạy cảm hằng ngày."}];
let currentFilter = "ALL";
let currentId = EPISODES[0].id;
let selectedHookIdx = 0;
let isPlaying = false;
let speed = 48; // px per second
let mirrorX = false;
let showCues = true;
let lastFrameTime = null;
let doneMap = JSON.parse(localStorage.getItem("tp_done_20_av_htpm") || "{}");

const epListEl = document.getElementById("epList");
const stageEl = document.getElementById("stageContent");
const scroller = document.getElementById("scroller");
const btnPlay = document.getElementById("btnPlay");
const btnDone = document.getElementById("btnDone");
const progressTxt = document.getElementById("progressTxt");

function getFiltered() {
  if (currentFilter === "AV") return EPISODES.filter(e => e.brand === "AN VƯỢNG");
  if (currentFilter === "HT") return EPISODES.filter(e => e.brand === "HẰNG THU");
  if (currentFilter === "TODO") return EPISODES.filter(e => !doneMap[e.id]);
  return EPISODES;
}

function formatText(t) {
  return t.replace(/ \/ /g, '<span class="slash-mark"> / </span><br>');
}

function updateProgress() {
  const cnt = EPISODES.filter(e => doneMap[e.id]).length;
  progressTxt.textContent = `Đã quay: ${cnt}/${EPISODES.length}`;
}

function renderSidebar() {
  const list = getFiltered();
  epListEl.innerHTML = "";
  let lastSet = "";
  list.forEach(ep => {
    if (currentFilter === "ALL" && ep.set_name !== lastSet) {
      lastSet = ep.set_name;
      const sh = document.createElement("div");
      sh.className = "set-header";
      sh.textContent = ep.set_name;
      epListEl.appendChild(sh);
    }
    const item = document.createElement("div");
    item.className = "ep-item" + (ep.id === currentId ? " active" : "") + (doneMap[ep.id] ? " done" : "");
    item.innerHTML = `
      <span class="badge ${ep.brand === 'AN VƯỢNG' ? 'av' : 'ht'}">${ep.id}</span>
      <div style="flex:1">
        <div class="ep-title">${doneMap[ep.id] ? "✅ " : ""}${ep.product}</div>
        <div class="ep-sub">${ep.duration} · ${ep.set}</div>
      </div>
    `;
    item.onclick = () => selectEpisode(ep.id);
    epListEl.appendChild(item);
  });
  updateProgress();
}

function selectEpisode(id) {
  currentId = id;
  selectedHookIdx = 0;
  stopPlay();
  renderSidebar();
  renderStage();
  scroller.scrollTop = 0;
}

function renderStage() {
  const ep = EPISODES.find(e => e.id === currentId) || EPISODES[0];
  const isDone = !!doneMap[ep.id];
  btnDone.classList.toggle("is-done", isDone);
  btnDone.textContent = isDone ? "✅ Đã quay xong" : "☐ Đánh dấu đã quay";

  const hookBtns = ep.hooks.map((h, i) => `
    <button class="${i === selectedHookIdx ? 'active' : ''}" onclick="switchHook(${i})">${h[0]}</button>
  `).join("");

  const bodyHtml = ep.lines.map(ln => {
    if (ln.type === "cue") return `<div class="line-cue">${ln.text}</div>`;
    if (ln.type === "cta") return `<div class="line-cta">${formatText(ln.text)}</div>`;
    return `<div class="line-body">${formatText(ln.text)}</div>`;
  }).join("");

  stageEl.innerHTML = `
    <div class="meta-banner">
      <div class="m-top">
        <span class="m-id">${ep.id} — ${ep.brand}</span>
        <span class="badge ${ep.brand === 'AN VƯỢNG' ? 'av' : 'ht'}">${ep.duration}</span>
        <span style="color:#cbd5e1;font-weight:700;">${ep.set_name}</span>
      </div>
      <div class="m-props">📦 Đạo cụ: ${ep.props}</div>
      <div class="m-mood">🎭 Diễn xuất: ${ep.mood}</div>
    </div>
    <div class="hook-switcher">${hookBtns}</div>
    <div class="script-content ${showCues ? '' : 'hide-cues'}">
      <div class="line-hook">${formatText(ep.hooks[selectedHookIdx][1])}</div>
      ${bodyHtml}
      <div class="disclaimer-box">⚖️ Dòng chạy cuối video (không cần đọc to): ${ep.disclaimer}</div>
    </div>
  `;
}

window.switchHook = function(idx) {
  selectedHookIdx = idx;
  renderStage();
};

function startPlay() {
  if (isPlaying) return;
  isPlaying = true;
  lastFrameTime = null;
  btnPlay.classList.add("playing");
  btnPlay.textContent = "⏸ DỪNG (Space)";
  requestAnimationFrame(tickScroll);
}

function stopPlay() {
  isPlaying = false;
  lastFrameTime = null;
  btnPlay.classList.remove("playing");
  btnPlay.textContent = "▶ CHẠY (Space)";
}

function tickScroll(ts) {
  if (!isPlaying) return;
  if (lastFrameTime !== null) {
    const dt = (ts - lastFrameTime) / 1000;
    scroller.scrollTop += speed * dt;
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) {
      stopPlay();
      return;
    }
  }
  lastFrameTime = ts;
  requestAnimationFrame(tickScroll);
}

btnPlay.onclick = () => isPlaying ? stopPlay() : startPlay();
document.getElementById("btnReset").onclick = () => { stopPlay(); scroller.scrollTop = 0; };
document.getElementById("btnSidebar").onclick = () => document.getElementById("sidebar").classList.toggle("hidden");
document.getElementById("btnMirrorX").onclick = (e) => {
  mirrorX = !mirrorX;
  scroller.classList.toggle("mirror-x", mirrorX);
  e.target.classList.toggle("active", mirrorX);
};
document.getElementById("btnCues").onclick = (e) => {
  showCues = !showCues;
  e.target.classList.toggle("active", showCues);
  renderStage();
};
btnDone.onclick = () => {
  doneMap[currentId] = !doneMap[currentId];
  localStorage.setItem("tp_done_20_av_htpm", JSON.stringify(doneMap));
  renderSidebar();
  renderStage();
};

document.getElementById("rngSpeed").oninput = (e) => {
  speed = Number(e.target.value);
  document.getElementById("valSpeed").textContent = speed;
};
document.getElementById("rngFont").oninput = (e) => {
  const v = Number(e.target.value);
  document.documentElement.style.setProperty("--font-size", v + "px");
  document.getElementById("valFont").textContent = v;
};

function stepEp(dir) {
  const list = getFiltered();
  if (!list.length) return;
  const idx = list.findIndex(e => e.id === currentId);
  const next = list[(idx + dir + list.length) % list.length];
  selectEpisode(next.id);
}
document.getElementById("btnPrev").onclick = () => stepEp(-1);
document.getElementById("btnNext").onclick = () => stepEp(1);

document.querySelectorAll(".f-btn").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".f-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    currentFilter = b.dataset.filter;
    const list = getFiltered();
    if (list.length && !list.some(e => e.id === currentId)) {
      currentId = list[0].id;
    }
    renderSidebar();
    renderStage();
  };
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); isPlaying ? stopPlay() : startPlay(); }
  else if (e.code === "ArrowRight") stepEp(1);
  else if (e.code === "ArrowLeft") stepEp(-1);
  else if (e.code === "ArrowUp") {
    speed = Math.min(160, speed + 6);
    document.getElementById("rngSpeed").value = speed;
    document.getElementById("valSpeed").textContent = speed;
  }
  else if (e.code === "ArrowDown") {
    speed = Math.max(10, speed - 6);
    document.getElementById("rngSpeed").value = speed;
    document.getElementById("valSpeed").textContent = speed;
  }
  else if (e.key.toLowerCase() === "r") { stopPlay(); scroller.scrollTop = 0; }
  else if (e.key.toLowerCase() === "m") document.getElementById("btnMirrorX").click();
});

renderSidebar();
renderStage();
</script>
